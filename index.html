<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Media Gallery</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        img, video { max-width: 100%; height: auto; border-radius: 8px; margin-bottom: 20px; }
        .media-item { margin-bottom: 40px; }
    </style>
</head>
<body>

    <h1>Welcome to My Media Gallery</h1>

    <!-- PICTURE SECTION -->
    <div class="media-item">
        <h2>My Picture</h2>
        <img src="my-photo.jpg" alt="A description of the photo">
    </div>

    <!-- AUDIO SECTION -->
    <div class="media-item">
        <h2>My Audio Track</h2>
        <audio controls>
            <source src="my-audio.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </div>

    <!-- VIDEO SECTION -->
    <div class="media-item">
        <h2>My Video</h2>
        <video width="640" controls>
            <source src="my-video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

</body>
</html>
